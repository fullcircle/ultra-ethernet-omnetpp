# simple_scalable_test.ini - Working scalable network tests

[General]
# Global simulation settings
sim-time-limit = 10s
cmdenv-express-mode = true 
cmdenv-performance-display = true
record-eventlog = false
warmup-period = 2s

# Statistical collection
**.scalar-recording = true
**.vector-recording = false

# Base Ultra Ethernet parameters
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.fecOverhead = 0.12
**.errorRate = 1e-15
**.fecCorrectionBits = 8

# Link layer reliability
**.llrEnabled = true
**.llrTimeout = 1us
**.maxRetransmissions = 3
**.priCompressionRatio = 0.2

# Transport layer
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 256
**.initialCongestionWindow = 16

# In-Network Computing
**.incProcessingEnabled = true
**.processingLatency = 100ns
**.maxConcurrentOperations = 32

# Application workload defaults
**.workloadType = "AI_TRAINING"
**.messageSize = 1MB
**.communicationIntensity = 0.8
**.trafficStartTime = 3s
**.trafficRate = 1Gbps

#=============================================================================
# Small Scale Tests (4-64 nodes)
#=============================================================================

[Config Simple_4_Node]
network = SimpleScalableNetwork_4
description = "4-node simple test network"

**.communicationPattern = "ALL_REDUCE"
**.jobSize = 4

[Config Simple_16_Node]
network = SimpleScalableNetwork_16
description = "16-node Leaf-Spine test network"

**.communicationPattern = "ALL_REDUCE"
**.jobSize = 16
**.messageSize = 2MB

[Config Simple_64_Node]
network = SimpleScalableNetwork_64
description = "64-node Leaf-Spine test network"

**.communicationPattern = "ALL_REDUCE"
**.jobSize = 64
**.messageSize = 4MB
**.communicationIntensity = 0.9