[Config DebugTest]
network = TwoHostConnected
sim-time-limit = 0.11s
record-eventlog = false
cmdenv-express-mode = true
cmdenv-performance-display = true

# Force traffic generation
**.jobSize = 2
**.communicationIntensity = 1.0
**.trafficStartTime = 0.1s
**.messageSize = 1000B

# Enable debug output
**.app.*.record-scalar = true
EOF < /dev/null
