# working_multi_test.ini - Working multi-host configurations

[General]
# Global simulation settings
sim-time-limit = 10s
cmdenv-express-mode = true 
cmdenv-performance-display = true
record-eventlog = false
warmup-period = 2s

# Statistical collection
**.scalar-recording = true
**.vector-recording = false

# Base Ultra Ethernet parameters
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.fecOverhead = 0.12
**.errorRate = 1e-15
**.fecCorrectionBits = 8

# Link layer reliability
**.llrEnabled = true
**.llrTimeout = 1us
**.maxRetransmissions = 3
**.priCompressionRatio = 0.2

# Transport layer
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 256
**.initialCongestionWindow = 16

# In-Network Computing
**.incProcessingEnabled = true
**.processingLatency = 100ns
**.maxConcurrentOperations = 32

# Application workload defaults
**.workloadType = "AI_TRAINING"
**.messageSize = 1MB
**.communicationIntensity = 0.8
**.trafficStartTime = 3s
**.trafficRate = 1Gbps

#=============================================================================
# Working Multi-Host Tests
#=============================================================================

[Config TwoHost_Direct]
network = TwoHostDirect
description = "Two isolated hosts - tests multi-host simulation"

**.communicationPattern = "POINT_TO_POINT"
**.jobSize = 2

[Config MultiHost_4]
network = MultiHostSimulation
description = "4 isolated hosts simulating distributed training"

**.numHosts = 4
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 4
**.messageSize = 2MB

[Config MultiHost_16] 
network = MultiHostSimulation
description = "16 isolated hosts simulating large training job"

**.numHosts = 16
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 16
**.messageSize = 4MB
**.communicationIntensity = 0.9

[Config MultiHost_Stress]
network = MultiHostSimulation
description = "Stress test with high traffic"

**.numHosts = 8
**.communicationPattern = "ALL_TO_ALL"
**.jobSize = 8
**.messageSize = 8MB
**.communicationIntensity = 0.95
**.trafficRate = 10Gbps