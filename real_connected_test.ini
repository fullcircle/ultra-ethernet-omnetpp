# real_connected_test.ini - Tests with actually connected Ultra Ethernet hosts

[General]
sim-time-limit = 10s
cmdenv-express-mode = true 
cmdenv-performance-display = true
record-eventlog = false
warmup-period = 2s
**.scalar-recording = true
**.vector-recording = false

# Ultra Ethernet parameters
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15
**.llrEnabled = true
**.llrTimeout = 1us
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 256
**.initialCongestionWindow = 16
**.incProcessingEnabled = true

# Application workload
**.workloadType = "AI_TRAINING"
**.trafficStartTime = 3s
**.trafficRate = 1Gbps

#=============================================================================
# Real Connected Network Tests
#=============================================================================

[Config TwoHost_Connected]
network = TwoHostConnected
description = "2 hosts directly connected - should show real traffic flow"

**.communicationPattern = "ALL_REDUCE"
**.jobSize = 2
**.messageSize = 1MB
**.communicationIntensity = 0.8

[Config FourHost_Star]
network = FourHostStar  
description = "4 hosts connected via central switch"

**.communicationPattern = "ALL_REDUCE"
**.jobSize = 4
**.messageSize = 2MB
**.communicationIntensity = 0.9

[Config SixteenHost_Switched]
network = SixteenHostSwitched
description = "16 hosts via single switch"

**.communicationPattern = "ALL_REDUCE"
**.jobSize = 16
**.messageSize = 4MB
**.communicationIntensity = 0.9
**.trafficRate = 10Gbps

[Config LeafSpine_64]
network = LeafSpineScaled
description = "64 hosts in leaf-spine topology - massive scale"

**.numHosts = 64
**.hostsPerLeaf = 16
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 64
**.messageSize = 8MB
**.communicationIntensity = 0.95
**.trafficRate = 25Gbps