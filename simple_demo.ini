# simple_demo.ini - Simple animated demonstration

[General]
network = SimpleDemo
sim-time-limit = 20s

# Configure ethernet gate sizes
**.host*.ethg[0].typename = ""
**.host*.ethg[1].typename = ""

# Animation settings
cmdenv-express-mode = false
record-eventlog = true
**.vector-recording = true

# Physical layer
**.linkSpeed = 800Gbps
**.fecEnabled = true

# Transport settings for visible traffic
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true

# AI workload with slower traffic for visualization
**.workloadType = "AI_TRAINING"
**.communicationPattern = "ALLREDUCE"
**.messageSize = 1MB
**.jobSize = 4
**.communicationIntensity = 0.2  # Slower for better visualization
**.trafficStartTime = 2s

# Statistics
**.scalar-recording = true