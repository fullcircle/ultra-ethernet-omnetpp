# connected_test.ini - Tests with actually connected networks

[General]
sim-time-limit = 10s
cmdenv-express-mode = true 
cmdenv-performance-display = true
record-eventlog = false
warmup-period = 2s
**.scalar-recording = true
**.vector-recording = false

# Network configuration - using direct addressing

# Ultra Ethernet parameters
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15
**.llrEnabled = true
**.llrTimeout = 1us
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 256
**.initialCongestionWindow = 16
**.incProcessingEnabled = true

# Application workload
**.workloadType = "AI_TRAINING"
**.trafficStartTime = 3s
**.trafficRate = 1Gbps

#=============================================================================
# Connected Network Tests
#=============================================================================

[Config Bus_4_Hosts]
network = BusNetwork
description = "4 hosts connected via switch"

**.numHosts = 4
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 4
**.messageSize = 1048576
**.communicationIntensity = 0.8

[Config Star_16_Hosts]
network = StarNetwork  
description = "16 hosts in star topology"

**.numHosts = 16
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 16
**.messageSize = 2097152
**.communicationIntensity = 0.9

[Config LeafSpine_64_Hosts]
network = LeafSpineConnected
description = "64 hosts in leaf-spine topology"

**.numHosts = 64
**.hostsPerLeaf = 16
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 64
**.messageSize = 4MB
**.communicationIntensity = 0.9
**.trafficRate = 10Gbps