# traffic_test.ini - Simple traffic test configuration

[General]
network = SimpleTrafficTest
sim-time-limit = 20s

# Basic performance settings
cmdenv-express-mode = true
cmdenv-performance-display = true
record-eventlog = false

# Statistical collection
warmup-period = 2s
**.scalar-recording = true
**.vector-recording = false

# Physical layer parameters
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15
**.fecCorrectionBits = 8

# Link layer parameters
**.llrEnabled = true
**.llrTimeout = 1us
**.maxRetransmissions = 3

# Transport layer parameters
**.profileType = "AI_FULL"
**.packetSprayingEnabled = false
**.reorderingEnabled = true
**.maxReorderBuffer = 256
**.initialCongestionWindow = 10

# Application parameters
**.workloadType = "AI_TRAINING"
**.communicationPattern = "POINT_TO_POINT"
**.messageSize = 64KB
**.jobSize = 2
**.communicationIntensity = 0.7
**.trafficStartTime = 3s
**.trafficRate = 1Gbps