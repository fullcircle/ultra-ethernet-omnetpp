# loopback_test.ini - Loopback test to verify message delivery works

[General]
network = UltraEthernetHost_Test
sim-time-limit = 10s
cmdenv-express-mode = true
cmdenv-performance-display = true
record-eventlog = false
warmup-period = 1s
**.scalar-recording = true
**.vector-recording = false

# Physical layer parameters
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15  # Very low error rate
**.llrEnabled = true
**.llrTimeout = 1us
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 256
**.initialCongestionWindow = 10
**.incProcessingEnabled = true

# Loopback test - host sends to itself  
**.workloadType = "AI_TRAINING"
**.communicationPattern = "POINT_TO_POINT"  # Use point-to-point instead
**.messageSize = 1MB
**.jobSize = 2  # Pretend there are 2 hosts, so host 0 sends to host 1
**.communicationIntensity = 0.5  # Lower intensity for cleaner analysis
**.trafficStartTime = 2s
**.trafficRate = 1Gbps