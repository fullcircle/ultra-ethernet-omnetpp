# demo.ini - Visual demonstration configuration

[General]
network = UltraEthernetDemo
sim-time-limit = 30s

# Configure host ethernet gates
**.host[*].ethg[0].typename = ""

# GUI Settings for Animation
**.vector-recording = true
cmdenv-express-mode = false
record-eventlog = true

# Physical layer visualization
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.fecOverhead = 0.12
**.errorRate = 1e-12
**.fecCorrectionBits = 8

# Link layer visualization
**.llrEnabled = true
**.llrTimeout = 1us
**.maxRetransmissions = 3
**.priCompressionRatio = 0.2

# Transport layer for visual effects
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 256
**.initialCongestionWindow = 10

# AI Training workload - visible traffic patterns
**.workloadType = "AI_TRAINING"
**.communicationPattern = "ALLREDUCE"
**.messageSize = 1MB
**.jobSize = 4  # Number of hosts
**.communicationIntensity = 0.3  # Slower for visualization
**.trafficStartTime = 2s
**.trafficRate = 500Mbps

# INC processing visualization
**.incProcessingEnabled = true
**.processingLatency = 100ns
**.maxConcurrentOperations = 16

# Statistics collection
**.scalar-recording = true
warmup-period = 1s