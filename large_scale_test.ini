# large_scale_test.ini - Large scale multi-host test

[General]
sim-time-limit = 10s
cmdenv-express-mode = true 
cmdenv-performance-display = true
record-eventlog = false
warmup-period = 2s
**.scalar-recording = true
**.vector-recording = false

# Parallel simulation configuration for MPI
parallel-simulation = false  # Default disabled, enabled per-config as needed
parsim-communications-class = "cMPICommunications"
parsim-synchronization-class = "cNullMessageProtocol"  
parsim-debug = false

# Ultra Ethernet parameters optimized for scale
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15
**.llrEnabled = true
**.llrTimeout = 1us
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 512
**.initialCongestionWindow = 32
**.incProcessingEnabled = true

# Large scale AI training workloads
**.workloadType = "AI_TRAINING"
**.trafficStartTime = 3s
**.trafficRate = 10Gbps

[Config MultiHost_64]
network = MultiHostSimulation
description = "64-host large scale AI training"

**.numHosts = 64
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 64
**.messageSize = 8388608
**.communicationIntensity = 0.9

[Config MultiHost_100]
network = MultiHostSimulation  
description = "100-host extreme scale test"

**.numHosts = 100
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 100
**.messageSize = 16777216
**.communicationIntensity = 0.6
**.trafficRate = 25Gbps

[Config MultiHost_256]
network = MultiHostSimulation
description = "256-host massive scale simulation"

**.numHosts = 256
**.communicationPattern = "ALL_REDUCE" 
**.jobSize = 256
**.messageSize = 33554432
**.communicationIntensity = 0.5
**.trafficRate = 50Gbps

# ========================================
# 1000-Host Topology-Specific Configurations
# ========================================

[Config LeafSpine_1000]
network = UltraEthernet_1K_LeafSpine
description = "1000-host Leaf-Spine topology for data center AI/HPC"

# Topology configuration
**.topologyType = "LEAF_SPINE"
**.numNodes = 1000
**.numSpineSwitches = 8
**.hostsPerLeaf = 32

# Ultra Ethernet optimizations for large scale
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15
**.llrEnabled = true
**.llrTimeout = 2us
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 1024
**.initialCongestionWindow = 64

# AI training workload optimized for leaf-spine
**.workloadType = "AI_TRAINING"
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 32
**.messageSize = 1048576
**.communicationIntensity = 0.7
**.trafficStartTime = 3s
**.trafficRate = 10Gbps

# Large scale simulation settings
**.parallelSimulation = true
**.numPartitions = 8
sim-time-limit = 300s
warmup-period = 5s

[Config Dragonfly_1000]
network = UltraEthernet_1K_Dragonfly
description = "1000-host Dragonfly topology for HPC clusters"

# Topology configuration
**.topologyType = "DRAGONFLY"
**.numNodes = 1000
**.routersPerGroup = 16
**.hostsPerRouter = 8
**.globalConnections = 4

# Ultra Ethernet optimizations
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15
**.llrEnabled = true
**.llrTimeout = 2us
**.profileType = "HPC"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 512
**.initialCongestionWindow = 32

# HPC workload optimized for dragonfly
**.workloadType = "HPC_SIMULATION"
**.communicationPattern = "ALL_GATHER"
**.jobSize = 1000
**.messageSize = 4194304
**.communicationIntensity = 0.90
**.trafficStartTime = 3s
**.trafficRate = 80Gbps

# Dragonfly-specific settings
**.adaptiveRouting = true
**.loadBalancingEnabled = true

# Large scale simulation settings
**.parallelSimulation = true
**.numPartitions = 4
sim-time-limit = 300s
warmup-period = 5s

# PARSIM partitioning - use topology-aware assignment (disabled for single-process mode)
# network.*.partition_id = ask

