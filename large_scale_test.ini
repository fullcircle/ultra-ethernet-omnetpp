# large_scale_test.ini - Large scale multi-host test

[General]
sim-time-limit = 10s
cmdenv-express-mode = true 
cmdenv-performance-display = true
record-eventlog = false
warmup-period = 2s
**.scalar-recording = true
**.vector-recording = false

# Ultra Ethernet parameters optimized for scale
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15
**.llrEnabled = true
**.llrTimeout = 1us
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 512
**.initialCongestionWindow = 32
**.incProcessingEnabled = true

# Large scale AI training workloads
**.workloadType = "AI_TRAINING"
**.trafficStartTime = 3s
**.trafficRate = 10Gbps

[Config MultiHost_64]
network = MultiHostSimulation
description = "64-host large scale AI training"

**.numHosts = 64
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 64
**.messageSize = 8MB
**.communicationIntensity = 0.9

[Config MultiHost_100]
network = MultiHostSimulation  
description = "100-host extreme scale test"

**.numHosts = 100
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 100
**.messageSize = 16MB
**.communicationIntensity = 0.95
**.trafficRate = 25Gbps

[Config MultiHost_256]
network = MultiHostSimulation
description = "256-host massive scale simulation"

**.numHosts = 256
**.communicationPattern = "ALL_REDUCE" 
**.jobSize = 256
**.messageSize = 32MB
**.communicationIntensity = 0.98
**.trafficRate = 50Gbps

# ========================================
# 1000-Host Topology-Specific Configurations
# ========================================

[Config LeafSpine_1000]
network = ScalableNetworks
description = "1000-host Leaf-Spine topology for data center AI/HPC"

# Topology configuration
**.topologyType = "LEAF_SPINE"
**.numNodes = 1000
**.numSpineSwitches = 8
**.hostsPerLeaf = 32

# Ultra Ethernet optimizations for large scale
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15
**.llrEnabled = true
**.llrTimeout = 500ns
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 1024
**.initialCongestionWindow = 64

# AI training workload optimized for leaf-spine
**.workloadType = "AI_TRAINING"
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 1000
**.messageSize = 64MB
**.communicationIntensity = 0.95
**.trafficStartTime = 3s
**.trafficRate = 100Gbps

# Large scale simulation settings
**.parallelSimulation = true
**.numPartitions = 8
sim-time-limit = 30s
warmup-period = 5s

[Config Dragonfly_1000]
network = ScalableNetworks
description = "1000-host Dragonfly topology for HPC clusters"

# Topology configuration
**.topologyType = "DRAGONFLY"
**.numNodes = 1000
**.routersPerGroup = 16
**.hostsPerRouter = 8
**.globalConnections = 4

# Ultra Ethernet optimizations
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15
**.llrEnabled = true
**.llrTimeout = 500ns
**.profileType = "HPC"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 512
**.initialCongestionWindow = 32

# HPC workload optimized for dragonfly
**.workloadType = "HPC_SIMULATION"
**.communicationPattern = "ALL_GATHER"
**.jobSize = 1000
**.messageSize = 128MB
**.communicationIntensity = 0.90
**.trafficStartTime = 3s
**.trafficRate = 80Gbps

# Dragonfly-specific settings
**.adaptiveRouting = true
**.loadBalancingEnabled = true

# Large scale simulation settings
**.parallelSimulation = true
**.numPartitions = 8
sim-time-limit = 30s
warmup-period = 5s

[Config Mesh_1000]
network = ScalableNetworks
description = "1000-host Mesh topology for distributed computing"

# Topology configuration
**.topologyType = "MESH"
**.numNodes = 1000
**.fullMesh = false
**.meshDegree = 6
**.hostsPerSwitch = 16

# Ultra Ethernet optimizations
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-12
**.llrEnabled = true
**.llrTimeout = 1us
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 256
**.initialCongestionWindow = 16

# Mixed workload for mesh topology
**.workloadType = "AI_TRAINING"
**.communicationPattern = "ALL_TO_ALL"
**.jobSize = 1000
**.messageSize = 16MB
**.communicationIntensity = 0.85
**.trafficStartTime = 3s
**.trafficRate = 60Gbps

# Large scale simulation settings
**.parallelSimulation = true
**.numPartitions = 8
sim-time-limit = 30s
warmup-period = 5s

[Config Torus_1000]
network = ScalableNetworks
description = "1000-host 3D Torus topology for scientific computing"

# Topology configuration
**.topologyType = "TORUS_3D"
**.numNodes = 1000
**.dimensions = 3
**.wrapAround = true

# Ultra Ethernet optimizations for scientific computing
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15
**.llrEnabled = true
**.llrTimeout = 200ns
**.profileType = "HPC"
**.packetSprayingEnabled = false  # Deterministic routing for torus
**.reorderingEnabled = true
**.maxReorderBuffer = 128
**.initialCongestionWindow = 8

# Scientific computing workload
**.workloadType = "HPC_SIMULATION"
**.communicationPattern = "NEIGHBOR_EXCHANGE"
**.jobSize = 1000
**.messageSize = 8MB
**.communicationIntensity = 0.80
**.trafficStartTime = 3s
**.trafficRate = 40Gbps

# Torus-specific settings
**.deterministicRouting = true
**.dimensionOrderRouting = true

# Large scale simulation settings
**.parallelSimulation = true
**.numPartitions = 8
sim-time-limit = 30s
warmup-period = 5s