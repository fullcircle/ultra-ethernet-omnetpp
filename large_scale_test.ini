[Config LargeScaleTest_5K]
network = LargeScaleTrafficTest
description = "5000-host star topology for extreme scale testing"

# Network configuration
**.numHosts = 5000

# Extreme scale simulation settings
sim-time-limit = 120s
warmup-period = 10s
**.scalar-recording = true
**.vector-recording = false  # Critical for performance

# Ultra Ethernet parameters
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.profileType = "AI_BASE"  # Lighter profile for scale

# Conservative workload for 5K hosts
**.workloadType = "AI_TRAINING"
**.communicationPattern = "ALLREDUCE"
**.jobSize = 5000
**.messageSize = 524288  # 512KB in bytes  
**.communicationIntensity = 0.05  # Very conservative
**.trafficStartTime = 15s
**.trafficRate = 500Mbps

[Config Mesh_1000]
network = UltraEthernet_1K_Mesh
description = "1000-host Mesh topology for distributed computing"

# Topology configuration
**.topologyType = "MESH"
**.numNodes = 1000
**.fullMesh = false
**.meshDegree = 6
**.hostsPerSwitch = 16

# Ultra Ethernet optimizations
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-12
**.llrEnabled = true
**.llrTimeout = 1us
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 256
**.initialCongestionWindow = 16

# Mixed workload for mesh topology
**.workloadType = "AI_TRAINING"
**.communicationPattern = "ALL_TO_ALL"
**.jobSize = 64
**.messageSize = 1048576
**.communicationIntensity = 0.3
**.trafficStartTime = 3s
**.trafficRate = 5Gbps

# Large scale simulation settings
**.parallelSimulation = true
**.numPartitions = 8
sim-time-limit = 300s
warmup-period = 5s

[Config Torus_1000]
network = UltraEthernet_1K_Torus3D
description = "1000-host 3D Torus topology for scientific computing"

# Topology configuration
**.topologyType = "TORUS_3D"
**.numNodes = 1000
**.dimensions = 3
**.wrapAround = true

# Ultra Ethernet optimizations for scientific computing
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.errorRate = 1e-15
**.llrEnabled = true
**.llrTimeout = 200ns
**.profileType = "HPC"
**.packetSprayingEnabled = false  # Deterministic routing for torus
**.reorderingEnabled = true
**.maxReorderBuffer = 128
**.initialCongestionWindow = 8

# Scientific computing workload
**.workloadType = "HPC_SIMULATION"
**.communicationPattern = "NEIGHBOR_EXCHANGE"
**.jobSize = 1000
**.messageSize = 8388608
**.communicationIntensity = 0.80
**.trafficStartTime = 3s
**.trafficRate = 40Gbps

# Torus-specific settings
**.deterministicRouting = true
**.dimensionOrderRouting = true

# Large scale simulation settings
**.parallelSimulation = true
**.numPartitions = 8
sim-time-limit = 300s
warmup-period = 5s

