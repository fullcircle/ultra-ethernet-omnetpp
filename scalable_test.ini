# scalable_test.ini - Large-scale Ultra Ethernet network configurations

[General]
# Global simulation settings
sim-time-limit = 100s
cmdenv-express-mode = true 
cmdenv-performance-display = true
record-eventlog = false
warmup-period = 5s

# Statistical collection
**.scalar-recording = true
**.vector-recording = false

# Base Ultra Ethernet parameters
**.linkSpeed = 800Gbps
**.fecEnabled = true
**.fecOverhead = 0.12
**.errorRate = 1e-15
**.fecCorrectionBits = 8

# Link layer reliability
**.llrEnabled = true
**.llrTimeout = 1us
**.maxRetransmissions = 3
**.priCompressionRatio = 0.2

# Transport layer
**.profileType = "AI_FULL"
**.packetSprayingEnabled = true
**.reorderingEnabled = true
**.maxReorderBuffer = 512
**.initialCongestionWindow = 16

# In-Network Computing
**.incProcessingEnabled = true
**.processingLatency = 100ns
**.maxConcurrentOperations = 32

# Application workload defaults
**.workloadType = "AI_TRAINING"
**.messageSize = 4MB
**.communicationIntensity = 0.8
**.trafficStartTime = 10s
**.trafficRate = 10Gbps

#=============================================================================
# 100-Node Network Configurations
#=============================================================================

[Config UltraEthernet_100_LeafSpine]
network = UltraEthernet_100_LeafSpine
description = "100-node Leaf-Spine topology for AI workloads"

# Leaf-Spine specific traffic patterns
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 100
**.allReduceAlgorithm = "RING"

[Config UltraEthernet_100_Mesh] 
network = UltraEthernet_100_Mesh
description = "100-node Mesh topology"

**.communicationPattern = "ALL_TO_ALL"
**.jobSize = 100
**.meshOptimization = true

[Config UltraEthernet_100_Torus2D]
network = UltraEthernet_100_Torus2D
description = "100-node 2D Torus topology"

**.communicationPattern = "NEIGHBOR_EXCHANGE"
**.jobSize = 100
**.dimensionOrder = true

[Config UltraEthernet_100_Dragonfly]
network = UltraEthernet_100_Dragonfly  
description = "100-node Dragonfly topology"

**.communicationPattern = "ALL_GATHER"
**.jobSize = 100
**.adaptiveRouting = true

#=============================================================================
# 1K-Node Network Configurations  
#=============================================================================

[Config UltraEthernet_1K_LeafSpine]
network = UltraEthernet_1K_LeafSpine
description = "1024-node Leaf-Spine topology for large AI training"

# Scale up parameters for 1K nodes
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 1024
**.messageSize = 16MB
**.communicationIntensity = 0.9
**.trafficRate = 25Gbps
**.allReduceAlgorithm = "TREE"

# Enhanced buffering for scale
**.maxReorderBuffer = 1024
**.initialCongestionWindow = 32

[Config UltraEthernet_1K_Mesh]
network = UltraEthernet_1K_Mesh  
description = "1024-node Mesh topology"

**.communicationPattern = "PARAMETER_SERVER"
**.jobSize = 1024
**.messageSize = 8MB
**.serverRatio = 0.1

[Config UltraEthernet_1K_Torus3D]
network = UltraEthernet_1K_Torus3D
description = "1024-node 3D Torus topology"

**.communicationPattern = "STENCIL_3D"
**.jobSize = 1024
**.messageSize = 2MB
**.haloWidth = 2

[Config UltraEthernet_1K_Dragonfly]
network = UltraEthernet_1K_Dragonfly
description = "1024-node Dragonfly topology"

**.communicationPattern = "ALL_REDUCE"
**.jobSize = 1024  
**.messageSize = 32MB
**.adaptiveRouting = true
**.loadBalancing = true

#=============================================================================
# 10K-Node Network Configurations (Extreme Scale)
#=============================================================================

[Config UltraEthernet_10K_LeafSpine]
network = UltraEthernet_10K_LeafSpine
description = "10000-node Leaf-Spine for extreme scale AI training"

# Scale-appropriate parameters
**.communicationPattern = "ALL_REDUCE"
**.jobSize = 10000
**.messageSize = 64MB
**.communicationIntensity = 0.95
**.trafficRate = 100Gbps
**.allReduceAlgorithm = "HIERARCHICAL"

# Large-scale optimizations
**.maxReorderBuffer = 2048
**.initialCongestionWindow = 64
**.adaptiveRouting = true
**.loadBalancing = true
**.congestionControl = "ADVANCED"

[Config UltraEthernet_10K_Dragonfly]
network = UltraEthernet_10K_Dragonfly
description = "10000-node Dragonfly for HPC workloads"

**.communicationPattern = "ALL_TO_ALL"
**.jobSize = 10000
**.messageSize = 128MB
**.workloadType = "HPC_SIMULATION"

#=============================================================================
# Performance Comparison Configurations
#=============================================================================

# Performance comparison configurations removed - use individual configs instead

#=============================================================================
# Parameter Sweep Configurations
#=============================================================================

[Config Parameter_Sweep_MessageSize]
extends = UltraEthernet_1K_LeafSpine
description = "Sweep message sizes from 1MB to 128MB"

**.messageSize = ${msgSize = 1MB, 4MB, 16MB, 64MB, 128MB}

[Config Parameter_Sweep_Intensity]
extends = UltraEthernet_1K_LeafSpine  
description = "Sweep communication intensity"

**.communicationIntensity = ${intensity = 0.1, 0.3, 0.5, 0.7, 0.9, 0.99}

[Config Parameter_Sweep_LinkSpeed]
extends = UltraEthernet_1K_LeafSpine
description = "Compare different link speeds"

**.linkSpeed = ${speed = 400Gbps, 800Gbps, 1600Gbps}

#=============================================================================
# Fault Tolerance Testing
#=============================================================================

[Config Fault_Tolerance_Test]
extends = UltraEthernet_1K_LeafSpine
description = "Test network resilience with link/node failures"

# Enable failure simulation
**.failureRate = 1e-6
**.repairTime = 10s
**.adaptiveRouting = true
**.redundancyEnabled = true